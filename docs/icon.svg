<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>净页</title>
  <!-- 外框:纯白底 + 粗黑描边,无渐变、无灰阶 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#FFFFFF" stroke="#000000" stroke-width="20"/>
  <!-- 书页,右上角折角 -->
  <path d="M148 112 H300 L364 176 V400 H148 Z" fill="#FFFFFF" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
  <path d="M300 112 L364 176 H300 Z" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
  <!-- 文字行 -->
  <g stroke="#000000" stroke-width="18" stroke-linecap="round">
    <line x1="196" y1="244" x2="316" y2="244"/>
    <line x1="196" y1="292" x2="316" y2="292"/>
    <line x1="196" y1="340" x2="268" y2="340"/>
  </g>
</svg>
