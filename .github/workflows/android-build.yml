name: Android E-Ink Legado + Fanqie Auto Build & Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: '自定义版本号（留空则自动读取根目录 VERSION 文件）'
        required: false
        default: ''
      create_release:
        description: '构建完成后是否自动发布到 GitHub Releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Legado-E + Fanqie E-Ink APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Legacy Standalone Files (If Upgrading In-Place)
        run: |
          rm -rf app/src/main/java/com/jingye
          rm -rf app/src/test

      - name: Read Version from Input or VERSION File
        id: get_version
        shell: bash
        run: |
          INPUT_VER="${{ github.event.inputs.version_override }}"
          if [ -n "$INPUT_VER" ]; then
            RAW_VERSION=$(echo "$INPUT_VER" | tr -d '[:space:]')
          elif [ -f "VERSION" ]; then
            RAW_VERSION=$(head -n 1 VERSION | tr -d '[:space:]')
          else
            RAW_VERSION="0.5.0"
          fi
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "$CLEAN_VERSION" > VERSION
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Version: ${CLEAN_VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Licenses
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Download Bundled Open-Source E-Ink Fonts (Optional)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L --fail --retry 3 -o app/src/main/assets/fonts/LXGWWenKai-Regular.ttf \
            "https://github.com/lxgw/LxgwWenKai/releases/download/v1.500/LXGWWenKai-Regular.ttf" || true

      - name: Configure APK Signing
        shell: bash
        run: |
          cp .github/workflows/legado.jks app/legado.jks
          cat >> gradle.properties << 'EOF'

          RELEASE_STORE_FILE=./legado.jks
          RELEASE_KEY_ALIAS=legado
          RELEASE_STORE_PASSWORD=gedoor_legado
          RELEASE_KEY_PASSWORD=gedoor_legado
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AppRelease APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --stacktrace

      - name: Collect & Rename Release APK
        id: collect_apk
        shell: bash
        run: |
          mkdir -p release-dist
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          OUT_NAME="Legado-E-Fanqie-EInk-v${{ steps.get_version.outputs.version }}.apk"
          cp "$APK_PATH" "release-dist/$OUT_NAME"
          echo "apk_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          ls -lh release-dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-E-Fanqie-EInk-v${{ steps.get_version.outputs.version }}
          path: release-dist/*.apk
          if-no-files-found: error

      - name: Automatic Tag & GitHub Release
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "墨水屏阅读器 × 番茄小说原生纯净版 ${{ steps.get_version.outputs.tag }}"
          body: |
            ### 墨水屏阅读器 × 番茄小说原生纯净版 ${{ steps.get_version.outputs.tag }}
            - **修复阅读页正文插图只画空框不显示图片内容的问题**：恢复并重构 `ImageColumn` 真实位图渲染引擎（`ImageProvider.getImage` + `canvas.drawBitmap` + 异步缺失自愈重绘），修复 `<img ...>` 在 `<p>` 标签内的换行提取逻辑，确保下载抓取的正文插图在阅读页中完整清晰渲染。
            - **修复已删除书籍残留缓存导致番茄书城仍显示「已下载」无法重下的问题**：在 `Book.delete()`、`LocalBook.deleteBook()`、`BookshelfManageViewModel.deleteBook()`、`BookHelp.clearCache()` 全链路挂载 `purgeFanqieBookOnDelete`，删除书籍时同步物理清空章节 JSON 缓存、合成 TXT、`.toc.json`、封面与插图目录；并在番茄书城内支持孤儿缓存自动识别清零与「重新下载」按钮。
            - **修复番茄书城按钮文字挤压与裁切显示不全问题**：将番茄书城详情卡片操作按钮重构为宽敞的双排网格布局，并为所有按钮显式配置 `includeFontPadding="false"`、`minWidth="0dp"`、`minHeight="0dp"`、`paddingVertical="0dp"`，彻底消除高分屏与大字号下的按钮文字截断。
            - **仿番茄 App 原生目录命名、分卷折叠与 1-bit 无残影线框弹窗**：100% 保留番茄原生分卷与章节命名，支持点击分卷折叠/展开子目录，全局弹窗采用 1-bit 纯黑白线框与弹出/关闭双向白场局刷。
          files: release-dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
