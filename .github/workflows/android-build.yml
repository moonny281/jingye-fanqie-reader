name: Build Android APK & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "自定义发布版本号 (留空则读取 VERSION 文件并自动避免冲突)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Legado + Fanqie Integrated APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve Version & Update Gradle Version Info
        id: version
        run: |
          BASE_VER=$(cat VERSION | tr -d '[:space:]')
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            BASE_VER="${{ github.event.inputs.release_tag }}"
            BASE_VER="${BASE_VER#v}"
          fi
          if [ -z "$BASE_VER" ]; then
            BASE_VER="0.4.4"
          fi

          TAG_NAME="v${BASE_VER}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="v${BASE_VER}.${GITHUB_RUN_NUMBER}"
            FINAL_VER="${BASE_VER}.${GITHUB_RUN_NUMBER}"
          else
            FINAL_VER="${BASE_VER}"
          fi

          VERSION_CODE=$((14200 + ${GITHUB_RUN_NUMBER:-4}))
          echo "Resolved Version: ${FINAL_VER} (Tag: ${TAG_NAME}, Code: ${VERSION_CODE})"

          sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/g" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${FINAL_VER}\"/g" app/build.gradle

          echo "version=${FINAL_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Build Release APK (appRelease)
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --no-daemon --stacktrace

      - name: Collect & Rename APK Artifact
        id: collect
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK generated!"
            exit 1
          fi
          OUT_NAME="jingye-fanqie-reader-${{ steps.version.outputs.version }}.apk"
          cp "$APK_FILE" "dist-apk/${OUT_NAME}"
          sha256sum "dist-apk/${OUT_NAME}" > "dist-apk/${OUT_NAME}.sha256"
          echo "apk_path=dist-apk/${OUT_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${OUT_NAME}" >> $GITHUB_OUTPUT
          ls -lh dist-apk/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.apk_name }}
          path: dist-apk/*
          if-no-files-found: error

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "敬业番茄墨水屏阅读器 ${{ steps.version.outputs.tag }}"
          body: |
            ## 敬业番茄墨水屏阅读器 ${{ steps.version.outputs.tag }} 发布说明

            ### v0.4.4 核心更新亮点
            - **重构一级/二级目录探测与层级展示**：
              - 严格区分**一级目录（分卷：`FanqieVolume`）**与**二级目录（章节：`FanqieChapterItem`）**，彻底修复 `volumeIndex` 0/1 偏移混用导致第一卷丢失或卷名错位的问题；
              - 章节标题自动规范化并补全序号前缀（如 `第X章`），同时采用无冲突标记（一级分卷 `=== 第X卷 卷名 ===`、二级章节 `### 第X章 章节名 ###`），彻底消除网文正文内 `【系统提示】` 触发误切章的问题；
              - 阅读器目录页与番茄详情页新增 **1-bit 纯黑白线性【一级分卷 / 二级章节】可折叠目录树预览**（一级分卷纯黑底白字粗体横幅、二级章节纯白底缩进树状行），支持一键展开/收起分卷与点击章节直接跳读。
            - **彻底修复「实际已下载完但检测仍提示有更新/待续却无内容可下」Bug**：
              - 剔除番茄 `serial_count` 中因作者删章/审核未过产生的无 `itemId` 幽灵章节，全书总章数严格以目录 API 真实可下载章节列表为准；
              - 更新检测（`checkBookUpdate`）升级为按真实 `itemId` 集合精确对账，并对经过多轮重试仍为空章的条目自动归档，同时对旧版遗留的「假待续」状态支持一键自动治愈（Auto-Heal）。
            - **微信读书墨水屏 1-bit 纯黑白线性 UI + 封面保留 + 局刷/全刷独立控制**：
              - 全面保留书架与番茄搜索/详情页真实图书封面（含自动修复与本地持久化缓存），其余 UI 与开关控件全部采用 1-bit 纯黑白线性绘制，零动画、零水波纹；
              - 顶部栏「墨水屏刷新」内置**开启局部刷新清残影**、**开启全局刷新清残影**及**全刷间隔页数（1 / 3 / 5 / 8 / 10 / 15 / 20 页）**独立开关。
          files: |
            dist-apk/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
